name: Send SMTP Email
description: Send an email via SMTP from a GitHub Actions workflow.
inputs:
  smtp_server:
    description: 'SMTP server hostname or IP address'
    required: true
  smtp_port:
    description: 'SMTP server port'
    required: false
    default: '587'
  smtp_username:
    description: 'SMTP username, if required'
    required: false
    default: ''
  smtp_password:
    description: 'SMTP password, if required'
    required: false
    default: ''
  from_address:
    description: 'From email address'
    required: true
  to:
    description: 'Comma- or semicolon-separated recipient list'
    required: true
  subject:
    description: 'Email subject'
    required: false
    default: ''
  body:
    description: 'Email body content'
    required: false
    default: ''
  body_type:
    description: 'Email body type: plain or html'
    required: false
    default: 'plain'
  use_tls:
    description: 'Enable STARTTLS'
    required: false
    default: 'true'
  use_ssl:
    description: 'Use implicit SSL/TLS'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Send email
      shell: pwsh
      run: |
        ./.github/workflow-actions/send-email/send-email.ps1 \
          -smtpServer "${{ inputs.smtp_server }}" \
          -smtpPort ${{ inputs.smtp_port }} \
          -smtpUsername "${{ inputs.smtp_username }}" \
          -smtpPassword "${{ inputs.smtp_password }}" \
          -fromAddress "${{ inputs.from_address }}" \
          -to "${{ inputs.to }}" \
          -subject "${{ inputs.subject }}" \
          -body "${{ inputs.body }}" \
          -bodyType "${{ inputs.body_type }}" \
          -useTls "${{ inputs.use_tls }}" \
          -useSsl "${{ inputs.use_ssl }}"
